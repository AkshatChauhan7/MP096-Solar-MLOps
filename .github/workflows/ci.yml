name: Stage 3 CI

on:
  push:
    branches: ["**"]
  pull_request:
    branches: ["**"]

jobs:
  stage3-check:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout code
        uses: actions/checkout@v4

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: "3.11"
          cache: "pip"

      - name: Install dependencies
        run: |
          python -m pip install --upgrade pip
          pip install -r requirements.txt pytest fastapi uvicorn httpx pyyaml

      - name: Run tests
        run: pytest -v

      - name: Validate Kubernetes YAML
        run: python -c "import yaml, glob; [list(yaml.safe_load_all(open(p))) for p in glob.glob('k8s/*.yaml')]"

      - name: Build Docker image
        run: docker build -t solar-mlops-api:ci .
